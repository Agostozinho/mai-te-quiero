<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Mai ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .contenido-centrado {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        
        .mensaje-texto {
            color: #FF1493; /* El rosa fuerte de la flor */
            font-family: 'Great Vibes', cursive;
            /* Tamaño adaptativo: usa el valor más pequeño entre el ancho y el alto */
            font-size: clamp(2rem, 8vw, 6rem); 
            font-weight: normal;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
            padding: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

    <canvas id="heart"></canvas>
    
    <div class="contenido-centrado">
        <div class="mensaje-texto">Mai te quiero</div>
    </div>

    <script>
        const canvas = document.getElementById('heart');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            init();
        }

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            // Ajuste dinámico para PC: el corazón no debe superar el 80% de la altura o el ancho
            const scale = Math.min(canvas.width / 50, canvas.height / 50);
            return { x: x * scale, y: y * scale };
        }

        class Particle {
            constructor() {
                this.t = Math.random() * Math.PI * 2;
                this.size = Math.random() * 1.5 + 0.5;
                this.speed = Math.random() * 0.002 + 0.001; 
                this.opacity = Math.random() * 0.7 + 0.2;
                this.offset = (Math.random() - 0.5) * 25; 
            }
            
            update() {
                this.t += this.speed;
                const point = getHeartPoint(this.t);
                const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.03;
                this.x = canvas.width / 2 + (point.x * pulse) + (Math.cos(this.t) * this.offset);
                this.y = canvas.height / 2 + (point.y * pulse) + (Math.sin(this.t) * this.offset);
            }
            
            draw() {
                ctx.fillStyle = `rgba(255, 20, 147, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            // Aumentamos partículas para pantallas de PC más grandes
            const count = window.innerWidth > 1000 ? 2500 : 1800;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { 
                p.update(); 
                p.draw(); 
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
