<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Mai ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .mensaje-container {
            position: relative; z-index: 10;
            text-align: center; width: 100%;
            pointer-events: none;
        }
        .mensaje-texto {
            color: #FF1493; /* Rosa fuerte vibrante */
            font-family: 'Great Vibes', cursive;
            font-size: 12vw; /* Tamaño ideal para celular */
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <div class="mensaje-container">
        <div class="mensaje-texto">Mai te quiero ❤️</div>
    </div>

    <script>
        const canvas = document.getElementById('heart');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            init();
        }

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const scale = Math.min(canvas.width / 45, canvas.height / 45);
            return { x: x * scale, y: y * scale };
        }

        class Particle {
            constructor() {
                this.t = Math.random() * Math.PI * 2;
                this.size = Math.random() * 1.5 + 0.5;
                this.speed = Math.random() * 0.002 + 0.001; // Movimiento muy lento
                this.opacity = Math.random() * 0.7 + 0.2;
                this.offset = (Math.random() - 0.5) * 35; // Trazo grueso y difuso
            }
            update() {
                this.t += this.speed;
                const point = getHeartPoint(this.t);
                const pulse = 1 + Math.sin(Date.now() * 0.001) * 0.04;
                this.x = canvas.width / 2 + (point.x * pulse) + (Math.cos(this.t) * this.offset);
                this.y = canvas.height / 2 + (point.y * pulse) + (Math.sin(this.t) * this.offset);
            }
            draw() {
                ctx.fillStyle = `rgba(255, 20, 147, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < 1800; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
